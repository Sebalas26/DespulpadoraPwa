server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip optimizada para SPA / PWA
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Proxy de respaldo hacia el API publicado si algún cliente realiza peticiones relativas /api/ o /hubs/
    location /api/ {
        proxy_ssl_server_name on;
        proxy_pass https://apidevdespulpadora.parking-flow.com/api/;
        proxy_http_version 1.1;
        proxy_set_header Host apidevdespulpadora.parking-flow.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_ssl_server_name on;
        proxy_pass https://apidevdespulpadora.parking-flow.com/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host apidevdespulpadora.parking-flow.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos críticos del PWA y punto de entrada SPA:
    # Sin caché para garantizar que el Service Worker y el manifest detecten nuevas versiones inmediatamente
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Caché de larga duración para assets estáticos con hash generado por Angular (outputHashing: "all")
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|ico|png|jpe?g|gif|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Enrutamiento SPA: redirige cualquier ruta de Angular Router a /index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
