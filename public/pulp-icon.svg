<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pulpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="mangoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="passionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#pulpGrad)"/>
  
  <!-- Decorative Pulp / Fruit shape -->
  <g filter="url(#shadow)">
    <!-- Fruit Drop / Pulp Pouch -->
    <path d="M256 90 C340 180 380 260 380 330 C380 400 324 440 256 440 C188 440 132 400 132 330 C132 260 172 180 256 90 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M256 120 C325 195 355 265 355 325 C355 385 310 415 256 415 C202 415 157 385 157 325 C157 265 187 195 256 120 Z" fill="url(#mangoGrad)"/>
    
    <!-- Fresh Leaf -->
    <path d="M256 90 C256 40 310 30 330 50 C350 70 330 110 256 90 Z" fill="#34D399"/>
    <path d="M256 90 C256 50 210 40 195 55 C180 70 200 105 256 90 Z" fill="#059669"/>
    
    <!-- Fruit Pulp Splash details -->
    <circle cx="230" cy="300" r="16" fill="#EA580C" opacity="0.85"/>
    <circle cx="280" cy="270" r="12" fill="#D97706" opacity="0.85"/>
    <circle cx="265" cy="340" r="20" fill="#EF4444" opacity="0.8"/>
    <circle cx="215" cy="355" r="10" fill="#7C3AED" opacity="0.75"/>
    
    <!-- Dynamic shine highlight -->
    <path d="M200 210 C180 250 175 290 185 330 C180 300 185 255 210 220 Z" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
